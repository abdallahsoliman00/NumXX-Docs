numxx::zeros:
  short_name: zeros
  description: "Creates an array of a given shape and calls the default constructor for all elements."
  syntax:
    - "template <typename T = double, typename = std::enable_if_t<std::is_arithmetic_v<T>>>\nNArray<T> zeros(Shape shape);"
    - "template <typename T = double, typename = std::enable_if_t<std::is_arithmetic_v<T>>>\nNArray<T> zeros(const size_t size);"
  params:
    - T:
      - (defaults to double)
      - "The data type to be stored."
    - shape:
      - Shape
      - "Dimensions of the shape to create. (Creates an N-Dimensional array)"
    - size:
      - size_t
      -  "The size of the array (creates a 1D array)."
  returns:
    - NArray<double>:
      - "An NArray object of type T filled with zeros or the default constructed value of T."
    - int:
      - "description and what not."
  time_comp:
    - O(n)
  examples:
    - "Initialise an NArray of arbitrary shape:"
    - "zeros1.cpp"
    - "It also works for custom types:"
    - "zeros2.cpp"

