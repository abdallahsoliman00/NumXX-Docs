numxx::linspace:
  short_name: linspace
  description: "Creates an array of evenly spaced values within a given interval."
  syntax:
  - "NArray<double> linspace(const float start, const float stop, const size_t count, const bool endpoint = true);"
  params:
    - start:
      - double
      - "The first number in the array."
    - stop:
      - double
      - "The upper bound of the array."
    - count:
      - size_t
      - "The number of elements in the array."
    - endpoint:
      - bool (defaults to true)
      - "Spcifies whether on not the value of stop should be included as the last element of the array. Setting endpoint to true makes stop the last element of the array."
  returns:
    - NArray<double>:
      - "An NArray object of type double with equally spaced elements starting at start and ending at stop.\nIf endpoint is set to true, the elements are spaced such that stop is the final element of the array."
  time_comp:
    - O(n)
  examples:
    - "Create an NArray of 11 points from 0 to 1:"
    - "linspace.cpp"

numxx::arange:
  short_name: arange
  description: "Creates an array of evenly spaced values within a given interval."
  syntax:
  - "template <typename dtype = double, typename = std::enable_if_t<std::is_arithmetic_v<dtype>>>\nNArray<dtype> arange(const dtype start, const dtype stop, const dtype step = dtype(1));"
  params:
    - dtype:
      - (defaults to double)
      - 
    - start:
      - dtype
      - "The lower bound of the interval. This value is included in the output array."
    - stop:
      - dtype
      - "The upper bound of the interval. This value is NOT included in the output array."
    - step:
      - dtype
      - "The spacing between values. For any output array, this is the distance between any two contiguous values."
  returns:
    - NArray<dtype>:
      - "Returns an NArray of evenly spaced values."
  time_comp:
    - O(n)
  examples:
    - "Create NArrays of evenly spaced values using arange:"
    - "arange.cpp"

numxx::zeros:
  short_name: zeros
  description: "Creates an array of a given shape and calls the default constructor for all elements."
  syntax:
    - "template <typename dtype = double, typename = std::enable_if_t<std::is_arithmetic_v<dtype>>>\nNArray<dtype> zeros(Shape shape);"
    - "template <typename dtype = double, typename = std::enable_if_t<std::is_arithmetic_v<dtype>>>\nNArray<dtype> zeros(const size_t size);"
  params:
    - dtype:
      - (defaults to double)
      - "The data type to be stored."
    - shape:
      - Shape
      - "Dimensions of the shape to create. (Creates an N-Dimensional array)"
    - size:
      - size_t
      -  "The size of the array (creates a 1D array)."
  returns:
    - NArray<double>:
      - "An NArray object of type dtype filled with zeros or the default constructed value of dtype."
    - int:
      - "description and what not."
  time_comp:
    - O(n)
  examples:
    - "Initialise an NArray of arbitrary shape:"
    - "zeros1.cpp"
    - "It also works for custom types:"
    - "zeros2.cpp"

numxx::zeros_like:
  short_name: zeros_like
  description: "Creates an NArray with the same dimensions / Shape as another NArray and calls the default constructor for all elements."
  syntax:
  - "template <typename dtype = double, typename U>\nNArray<dtype> zeros_like(const NArray<U>& other);"
  - "template <typename dtype = double, typename U>\nNArray<dtype> zeros_like(const std::vector<U>& other);"
  params:
    - dtype:
      - (defaults to double)
      - "The data type to be stored."
    - U:
      - " "
      - "The data type of the other NArray or std::vector. This can be any data type."
    - other:
      - NArray, std::vector
      - "The other NArray or vector to be used as a size reference for the new NArray."
  returns:
    - NArray<dtype>:
      - "An NArray of the data type <i>dtype</i>'s default value."
  time_comp:
    - O(n)
  examples:
    - "zeros_like1.cpp"
    - "Just like numxx::zeros, numxx::zeros_like also calls the default constructor for all elements of the output array:"
    - "zeros_like2.cpp"

